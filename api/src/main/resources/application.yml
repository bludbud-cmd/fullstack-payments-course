spring:
  application:
    name: paydeck-api
  datasource:
    # Matches docker-compose.yml. Override with environment variables in production.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/paydeck}
    username: ${DATABASE_USERNAME:paydeck}
    password: ${DATABASE_PASSWORD:paydeck}
  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /docs

paydeck:
  auth:
    # Signs access tokens. Anyone who knows it can sign in as anyone, so set a
    # long random JWT_SECRET in production. This default is for your own Mac only.
    jwt-secret: ${JWT_SECRET:change-me-this-is-only-for-local-development}
    # People who register with one of these emails become admins.
    admin-emails: ${PAYDECK_ADMIN_EMAILS:}
    # Where "Sign in with Google" may send people back to: the app's own link.
    app-redirect-uris: ${PAYDECK_APP_REDIRECT_URIS:paydeck://auth}

  stripe:
    # Test-mode keys from https://dashboard.stripe.com/test/apikeys. Leave empty to switch card top-ups off.
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    public-base-url: ${PAYDECK_PUBLIC_BASE_URL:http://localhost:8080}
    app-return-url: ${PAYDECK_APP_TOP_UP_RETURN_URL:paydeck://top-up}
  push:
    # A Firebase service account key file. Leave empty to only log notifications.
    firebase-service-account-file: ${FIREBASE_SERVICE_ACCOUNT_FILE:}
  # The simulated "add pretend money" top-up from Part 6. Turn off when Stripe is live.
  simulated-top-ups: ${PAYDECK_SIMULATED_TOP_UPS:true}
