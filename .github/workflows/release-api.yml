name: Release API

# Publishes the API's container image to GitHub's registry (ghcr.io) when
# someone pushes a tag such as api-v1.0.0:
#   git tag api-v1.0.0 && git push origin api-v1.0.0
# Hosting services can then pull ghcr.io/<owner>/paydeck-api:1.0.0.
on:
  push:
    tags: ['api-v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Never publish an image whose tests fail.
      - run: ./mvnw -B verify
        working-directory: api
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paydeck-api"
          version="${GITHUB_REF_NAME#api-v}"
          docker build --tag "$image:$version" --tag "$image:latest" api
          docker push "$image:$version"
          docker push "$image:latest"
