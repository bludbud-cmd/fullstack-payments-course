name: Release app

# Builds release versions of the app when someone pushes a tag such as
# app-v1.0.0:
#   git tag app-v1.0.0 && git push origin app-v1.0.0
# The Android .apk/.aab and the zipped Mac app appear under the run's
# "Artifacts", ready to download, test, and upload to a store.
on:
  push:
    tags: ['app-v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      # The upload key lives in the repository's secrets, base64-encoded.
      # Without it, the build is signed with the debug key (see build.gradle).
      - name: Unpack the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "ORG_GRADLE_PROJECT_PAYDECK_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build the release
        working-directory: app/android
        env:
          ORG_GRADLE_PROJECT_PAYDECK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PAYDECK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PAYDECK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: paydeck-android
          path: |
            app/android/app/build/outputs/apk/release/*.apk
            app/android/app/build/outputs/bundle/release/*.aab

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Install CocoaPods dependencies
        working-directory: app/macos
        run: pod install
      # Unsigned: people open it with right-click > Open the first time.
      # Signing and notarizing need a paid Apple Developer account (optional bonus lesson).
      - name: Build the release
        working-directory: app/macos
        run: >
          xcodebuild -workspace PayDeck.xcworkspace -scheme PayDeck-macOS
          -configuration Release -destination 'platform=macOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Zip the app
        working-directory: app/macos/build/Build/Products/Release
        run: ditto -c -k --keepParent PayDeck.app "$GITHUB_WORKSPACE/PayDeck-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: paydeck-macos
          path: PayDeck-macOS.zip
